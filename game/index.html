<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a24; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hud { position: fixed; color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; user-select: none; }
  .panel { background: rgba(8, 20, 30, .55); border: 1px solid rgba(180, 220, 255, .35); border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #hud-left { top: 14px; left: 14px; display: flex; gap: 10px; }
  #hud-left .panel { min-width: 92px; text-align: center; }
  #hud-left .label { font-size: 10px; letter-spacing: 2px; color: #9fd0ee; }
  #hud-left .value { font-size: 22px; font-weight: 700; line-height: 1.15; }
  #hud-left .sub { font-size: 11px; color: #cfe8f5; }
  #hud-right { top: 14px; right: 14px; width: 230px; }
  #hud-right .row { display: flex; justify-content: space-between; font-size: 13px; margin: 2px 0; }
  #hud-right .row b { color: #ffd166; }
  #hud-mission { font-size: 14px; font-weight: 700; color: #ffd166; margin-bottom: 2px; }
  #hud-objective { font-size: 12px; color: #d8ecf7; margin: 4px 0 6px; }
  .bar { height: 9px; background: rgba(255,255,255,.18); border-radius: 5px; overflow: hidden; margin: 2px 0 6px; }
  .bar > div { height: 100%; border-radius: 5px; background: #37c978; transition: width .15s linear; }
  #hud-throttle-fill { background: #4db2ff; }
  #hud-fuel-fill.low { background: #ff5a4e; }
  .bar-label { display: flex; justify-content: space-between; font-size: 11px; color: #cfe8f5; }
  #hud-horizon { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(180,220,255,.5); background: #274b63; }
  #hud-horizon-ball { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; transform: translate(-50%, 0); }
  #hud-horizon-ball .sky { height: 50%; background: linear-gradient(#7ec3ee, #bfe3f5); }
  #hud-horizon-ball .ground { height: 50%; background: linear-gradient(#8a6b46, #5d4630); }
  #hud-horizon-ball .line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #fff; margin-top: -1px; }
  #hud-horizon-label { position: fixed; left: 50%; bottom: 142px; transform: translateX(-50%); font-size: 10px; letter-spacing: 2px; color: #cfe8f5; }
  #hud-message { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-size: 26px; font-weight: 700; color: #fff; opacity: 0; transition: opacity .4s; text-align: center; max-width: 80%; }
  #hud-warn { position: fixed; left: 50%; top: 34%; transform: translateX(-50%); font-size: 20px; font-weight: 800; color: #ff5a4e; display: none; animation: blink 0.7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6, 16, 24, .72); color: #eaf6ff; text-align: center; padding: 20px; z-index: 5; }
  #screen-title { font-size: 46px; font-weight: 800; letter-spacing: 1px; margin: 0 0 12px; color: #ffd166; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #screen-text { font-size: 17px; line-height: 1.6; white-space: pre-line; max-width: 560px; }
  #screen-hint { margin-top: 22px; font-size: 14px; color: #9fd0ee; letter-spacing: 1px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Sky Courier: fly the cargo plane through the rings and land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div class="hud" id="hud-left">
  <div class="panel"><div class="label">ALTITUDE</div><div class="value" id="hud-alt">0 ft</div></div>
  <div class="panel"><div class="label">AIRSPEED</div><div class="value" id="hud-speed">0 kt</div></div>
  <div class="panel"><div class="label">HEADING</div><div class="value" id="hud-heading">090°</div><div class="sub" id="hud-compass">E</div></div>
</div>

<div class="hud panel" id="hud-right">
  <div id="hud-mission">Delivery 1 — Harbour Run</div>
  <div id="hud-objective">Fly through ring 1 of 5</div>
  <div class="row"><span>Rings</span><b id="hud-rings">Rings 0 / 5</b></div>
  <div class="row"><span>Score</span><b id="hud-score">0</b></div>
  <div class="row"><span>Time</span><b id="hud-time">00:00</b></div>
  <div class="bar-label"><span>THROTTLE</span><span id="hud-throttle-val">0%</span></div>
  <div class="bar"><div id="hud-throttle-fill" style="width:0%"></div></div>
  <div class="bar-label"><span>FUEL</span><span id="hud-fuel-val">100%</span></div>
  <div class="bar"><div id="hud-fuel-fill" style="width:100%"></div></div>
</div>

<div id="hud-horizon-label">ARTIFICIAL HORIZON</div>
<div class="hud" id="hud-horizon"><div id="hud-horizon-ball"><div class="sky"></div><div class="ground"></div><div class="line"></div></div></div>
<div class="hud" id="hud-message"></div>
<div class="hud" id="hud-warn"></div>

<div id="screen">
  <h1 id="screen-title">Sky Courier</h1>
  <p id="screen-text"></p>
  <p id="screen-hint"></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
